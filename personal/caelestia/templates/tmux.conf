# Generated by Caelestia. Consumed by the Tokyo Night tmux plugin.
set -g @caelestia_mode "{{ mode }}"
set -g @caelestia_background "#{{ background.hex }}"
set -g @caelestia_foreground "#{{ onSurface.hex }}"
set -g @caelestia_muted "#{{ onSurfaceVariant.hex }}"
set -g @caelestia_border "#{{ outline.hex }}"
set -g @caelestia_accent "#{{ primary.hex }}"
set -g @caelestia_accent_fg "#{{ onPrimary.hex }}"
set -g @caelestia_active_bg "#{{ surfaceContainerHighest.hex }}"
set -g @caelestia_secondary "#{{ secondary.hex }}"
set -g @caelestia_tertiary "#{{ tertiary.hex }}"
set -g @caelestia_positive "#{{ success.hex }}"
set -g @caelestia_negative "#{{ error.hex }}"
